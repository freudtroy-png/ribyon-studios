<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Inquiry — Ribyon Studios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0ece4; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    @media (max-width: 600px) {
      .card { border-radius: 20px !important; margin: 16px !important; }
      .card-body { padding: 28px 20px 32px !important; }
    }
  </style>

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<body style="margin:0;padding:40px 20px;background:#f0ece4;">

  <div style="display:none;max-height:0;overflow:hidden;">New client inquiry via ribyonstudios.com&#847;</div>

  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center">
        <table class="card" width="480" cellpadding="0" cellspacing="0" border="0"
          style="max-width:480px;width:100%;background:#ffffff;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.1);">

          <!-- Top accent bar -->
          <tr><td style="height:4px;background:linear-gradient(90deg,#f97316,#fbbf24);"></td></tr>

          <!-- Icon area -->
          <tr>
            <td align="center" style="padding:40px 40px 20px;">
              <div style="display:inline-block;position:relative;">
                <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:80px;height:20px;background:radial-gradient(ellipse,rgba(249,115,22,0.3),transparent 70%);filter:blur(6px);border-radius:50%;"></div>
                <svg width="72" height="60" viewBox="0 0 72 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="nb" x1="0" y1="0" x2="72" y2="60" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#ff9a3c"/>
                      <stop offset="100%" stop-color="#f97316"/>
                    </linearGradient>
                  </defs>
                  <rect x="0" y="12" width="72" height="48" rx="8" fill="url(#nb)"/>
                  <path d="M0 12 L36 32 L72 12" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
                  <!-- Alert dot -->
                  <circle cx="58" cy="10" r="10" fill="#ef4444"/>
                  <text x="58" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="Arial">!</text>
                </svg>
              </div>
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding:0 40px 24px;">
              <h1 style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:24px;font-weight:800;color:#0a0908;letter-spacing:-0.03em;margin:0 0 8px;">
                New inquiry
              </h1>
              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#7d786e;margin:0;">
                Submitted via ribyonstudios.com
              </p>
            </td>
          </tr>

          <!-- Details table -->
          <tr>
            <td class="card-body" style="padding:0 32px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1.5px solid rgba(0,0,0,0.07);border-radius:16px;overflow:hidden;">
                <tr style="background:#faf8f5;">
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);width:100px;">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#b8b2a8;">Name</span>
                  </td>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#0a0908;">{{name}}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);background:#faf8f5;">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#b8b2a8;">Email</span>
                  </td>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <a href="mailto:{{email}}" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#f97316;text-decoration:none;font-weight:500;">{{email}}</a>
                  </td>
                </tr>
                <tr style="background:#faf8f5;">
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#b8b2a8;">Company</span>
                  </td>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#3a3730;">{{company}}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);background:#faf8f5;">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#b8b2a8;">Budget</span>
                  </td>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#3a3730;">{{budget}}</span>
                  </td>
                </tr>
                <tr style="background:#faf8f5;">
                  <td style="padding:13px 18px;vertical-align:top;">
                    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#b8b2a8;">Message</span>
                  </td>
                  <td style="padding:13px 18px;">
                    <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#3a3730;line-height:1.6;margin:0;">{{message}}</p>
                  </td>
                </tr>
              </table>

              <!-- Reply CTA -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin:24px auto 0;">
                <tr>
                  <td>
                    <a href="mailto:{{email}}?subject=Re: Your inquiry — Ribyon Studios"
                      style="display:block;background:#0a0908;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;text-decoration:none;padding:15px 40px;border-radius:999px;white-space:nowrap;letter-spacing:0.01em;">
                      Reply to {{name}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:18px 40px 24px;border-top:1px solid rgba(0,0,0,0.06);">
              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;color:#b8b2a8;margin:0;">
                Ribyon Studios internal · {{timestamp}} · <a href="https://ribyonstudios.com/admin" style="color:#f97316;text-decoration:none;">Admin panel</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
