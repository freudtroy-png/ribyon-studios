<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We got your message — Ribyon Studios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0ece4; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    @media (max-width: 600px) {
      .card { border-radius: 20px !important; margin: 16px !important; }
      .card-body { padding: 32px 24px 36px !important; }
    }
  </style>

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<body style="margin:0;padding:40px 20px;background:#f0ece4;">

  <!-- Hidden preheader -->
  <div style="display:none;max-height:0;overflow:hidden;">We've received your message and will be in touch within 48 hours.&#847;</div>

  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center">

        <!-- Card -->
        <table class="card" width="440" cellpadding="0" cellspacing="0" border="0"
          style="max-width:440px;width:100%;background:#ffffff;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.1);">

          <!-- Envelope illustration area -->
          <tr>
            <td align="center" style="padding:48px 40px 24px;background:#ffffff;">
              <!-- Envelope SVG — 3D style with gradient, glow underneath -->
              <div style="display:inline-block;position:relative;">
                <!-- Glow -->
                <div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:100px;height:24px;background:radial-gradient(ellipse,rgba(249,115,22,0.35),transparent 70%);border-radius:50%;filter:blur(8px);"></div>
                <svg width="108" height="88" viewBox="0 0 108 88" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="envBody" x1="0" y1="0" x2="108" y2="88" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#ff9a3c"/>
                      <stop offset="100%" stop-color="#f97316"/>
                    </linearGradient>
                    <linearGradient id="envFlap" x1="0" y1="0" x2="108" y2="40" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#ffb366"/>
                      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
                    </linearGradient>
                    <linearGradient id="envFold" x1="0" y1="40" x2="108" y2="88" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#ea580c"/>
                      <stop offset="100%" stop-color="#c2410c"/>
                    </linearGradient>
                  </defs>
                  <!-- Body -->
                  <rect x="0" y="20" width="108" height="68" rx="10" fill="url(#envBody)"/>
                  <!-- Bottom fold triangles (give 3D depth) -->
                  <path d="M0 88 L54 60 L108 88 Z" fill="url(#envFold)" opacity="0.5"/>
                  <!-- Flap (open, folded back) -->
                  <path d="M0 20 Q4 8 10 4 L54 32 L98 4 Q104 8 108 20 Z" fill="url(#envFlap)"/>
                  <!-- Diagonal crease lines -->
                  <path d="M0 88 L48 62" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                  <path d="M108 88 L60 62" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                </svg>
              </div>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td class="card-body" align="center" style="padding:8px 40px 44px;">

              <h1 style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;color:#0a0908;letter-spacing:-0.03em;margin:0 0 12px;line-height:1.2;">
                Message received.
              </h1>

              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;color:#7d786e;line-height:1.65;margin:0 0 8px;max-width:300px;">
                We've sent a confirmation to
              </p>
              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#f97316;line-height:1.65;margin:0 0 28px;">
                {{email}}
              </p>

              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;color:#7d786e;line-height:1.65;margin:0 0 32px;max-width:300px;">
                We review every message personally and will be in touch within 48 hours.
              </p>

              <!-- CTA -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                <tr>
                  <td style="border-radius:999px;overflow:hidden;">
                    <a href="https://ribyonstudios.com"
                      style="display:block;background:#0a0908;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;padding:16px 48px;border-radius:999px;letter-spacing:0.01em;white-space:nowrap;">
                      Back to Ribyon Studios
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 40px 28px;border-top:1px solid rgba(0,0,0,0.06);">
              <p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#b8b2a8;line-height:1.6;margin:0;">
                Ribyon Studios · Brand direction &amp; design · Nairobi<br>
                <a href="https://ribyonstudios.com" style="color:#f97316;text-decoration:none;">ribyonstudios.com</a>
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
