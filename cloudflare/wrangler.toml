name = "ribyon-cms-api"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding       = "DB"
database_name = "ribyon-cms-db"
database_id   = "68df256c-d752-4133-96f8-5a0a34e2bc58"

[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "ribyon-media"

[vars]
ALLOWED_ORIGIN = "https://ribyon-studios.vercel.app"

[dev]
port = 8787
local_protocol = "http"
